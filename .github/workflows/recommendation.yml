name: Recommendation

on:
  push:
    paths:
      - 'recommendation/**'
      - '.github/workflows/recommendation.yml'
  pull_request:
    paths:
      - 'recommendation/**'
      - '.github/workflows/recommendation.yml'

concurrency:
  group: recommendation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recommendation
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Laravel Pint
        run: php vendor/bin/pint --test

  test:
    name: Unit and feature tests
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recommendation
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath, tokenizer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel env
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          touch database/database.sqlite

      - name: PHPUnit
        run: php artisan test --exclude-testsuite=Integration

  integration:
    name: Integration tests (PostgreSQL + Qdrant + Kafka)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recommendation
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recommendation
          POSTGRES_USER: recommendation
          POSTGRES_PASSWORD: recommendation
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U recommendation -d recommendation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.12.5
        ports:
          - 6333:6333
      kafka:
        image: apache/kafka:3.9.1
        env:
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        ports:
          - 9092:9092
    env:
      RECOMMENDATION_INTEGRATION_TESTS: "1"
      RECOMMENDATION_TEST_DB_HOST: 127.0.0.1
      RECOMMENDATION_TEST_DB_PORT: "5435"
      RECOMMENDATION_TEST_DB_DATABASE: recommendation
      RECOMMENDATION_TEST_DB_USERNAME: recommendation
      RECOMMENDATION_TEST_DB_PASSWORD: recommendation
      QDRANT_HOST: 127.0.0.1
      QDRANT_PORT: "6333"
      KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, bcmath, tokenizer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel env
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: Wait for Kafka and create topics
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network host apache/kafka:3.9.1 /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          for topic in product.created product.updated product.deleted product.published product.unpublished stock.changed; do
            docker run --rm --network host apache/kafka:3.9.1 /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic "$topic"
          done

      - name: PHPUnit integration suite
        run: php artisan test --testsuite=Integration
