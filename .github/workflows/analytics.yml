name: Analytics

on:
  push:
    paths:
      - 'analytics/**'
      - '.github/workflows/analytics.yml'
  pull_request:
    paths:
      - 'analytics/**'
      - '.github/workflows/analytics.yml'

concurrency:
  group: analytics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Laravel Pint
        run: php vendor/bin/pint --test

  test:
    name: Unit and integration tests
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: analytics
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -q -O- http://localhost:8123/ping | grep -q Ok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      ANALYTICS_CLICKHOUSE_TESTS: '1'
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: analytics
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath, tokenizer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel env
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          touch database/database.sqlite

      - name: PHPUnit
        run: php artisan test
