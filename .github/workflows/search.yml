name: Search

on:
  push:
    paths:
      - 'search/**'
      - '.github/workflows/search.yml'
  pull_request:
    paths:
      - 'search/**'
      - '.github/workflows/search.yml'

concurrency:
  group: search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: search/go.sum

      - name: Download modules
        run: go mod download

      - name: Verify gofmt
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

  test:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: search/go.sum

      - name: Download modules
        run: go mod download

      - name: Go test
        run: go test ./...

  integration:
    name: Integration tests
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: search
    services:
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      kafka:
        image: bitnami/kafka:3.9
        env:
          KAFKA_CFG_NODE_ID: "0"
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: search/go.sum

      - name: Download modules
        run: go mod download

      - name: Go integration test
        env:
          OPENSEARCH_URL: http://localhost:9200
          KAFKA_BROKERS: localhost:9092
        run: go test -tags=integration ./test/integration/... -count=1 -timeout=5m

  docker:
    name: Build and publish image
    needs: [test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/search
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: search
          file: search/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
