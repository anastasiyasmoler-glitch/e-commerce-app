services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      cluster.name: search-cluster
      node.name: search-node
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [default]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [default]

  back:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      OPENSEARCH_URL: http://opensearch:9200
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP: search-service-group
      REDIS_ADDR: redis:6379
      CACHE_ENABLED: "true"
      FUZZY_SEARCH: "true"
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      default: {}
      microservices-net:
        aliases: [search-back]

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/search-consumer"]
    restart: unless-stopped
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      KAFKA_BROKERS: kafka:9092
      KAFKA_CONSUMER_GROUP: search-service-group
      REDIS_ADDR: redis:6379
    depends_on:
      opensearch:
        condition: service_healthy
      back:
        condition: service_healthy
    networks:
      default: {}
      microservices-net: {}

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8086:80"
      - "8446:443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs
    depends_on:
      back:
        condition: service_healthy
    networks:
      default: {}
      microservices-net:
        aliases: [search-nginx]

networks:
  microservices-net:
    external: true

volumes:
  opensearch_data:
