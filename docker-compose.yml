# Local stack: Auth + Notification, one Kafka
#
# Auth:     https://localhost
# Notification: https://localhost:8443
# Mailhog:  http://localhost:8025
# OIDC:     http://localhost:8080
#
# Gateway is not in this file. Isolated service compose has no Kafka.

services:
  sql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [auth]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [auth]

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [notification]

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    networks: [events]

  mail:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
    networks: [auth, notification]

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: '{"interactiveLogin":true}'
    networks: [auth]

  auth-back:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: https://localhost
      DB_CONNECTION: pgsql
      DB_HOST: sql
      DB_PORT: "5432"
      DB_DATABASE: auth
      DB_USERNAME: marketplace
      DB_PASSWORD: marketplace
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mail
      MAIL_PORT: "1025"
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-32ch}
      JWT_TTL: "15"
      JWT_REFRESH_TTL: "10080"
      JWT_BLACKLIST_ENABLED: "true"
      OIDC_ISSUER: http://oidc:8080/google
      GOOGLE_CLIENT_ID: mock-google-client
      GOOGLE_CLIENT_SECRET: mock-google-secret
      GOOGLE_REDIRECT_URI: https://localhost/auth/google/callback
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./services/auth:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    depends_on:
      sql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mail:
        condition: service_started
      oidc:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      auth:
        aliases: [back]
      events: {}

  auth-front:
    build:
      context: ./services/auth/frontend
      dockerfile: Dockerfile
    networks:
      auth:
        aliases: [front]

  auth-nginx:
    build:
      context: ./services/auth/docker/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/auth/public:/var/www/html/public
      - ./services/auth/docker/nginx/certs:/etc/nginx/certs
    depends_on:
      auth-back:
        condition: service_healthy
      auth-front:
        condition: service_started
    networks: [auth]

  notification-back:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: https://localhost:8443
      DB_CONNECTION: mongodb
      MONGODB_DSN: mongodb://mongo:27017
      MONGODB_HOST: mongo
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: notification
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: mail
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: notifications@example.com
      MAIL_FROM_NAME: Notification
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./services/notification:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started
      mail:
        condition: service_started
    networks:
      notification:
        aliases: [back]
      events: {}

  notification-consumer:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    command: ["php", "artisan", "kafka:consume-notifications"]
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: https://localhost:8443
      DB_CONNECTION: mongodb
      MONGODB_DSN: mongodb://mongo:27017
      MONGODB_HOST: mongo
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: notification
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: mail
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: notifications@example.com
      MAIL_FROM_NAME: Notification
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./services/notification:/var/www/html
    depends_on:
      notification-back:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started
      mail:
        condition: service_started
    networks:
      notification: {}
      events: {}

  notification-front:
    build:
      context: ./services/notification/frontend
      dockerfile: Dockerfile
    networks:
      notification:
        aliases: [front]

  notification-nginx:
    build:
      context: ./services/notification/docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./services/notification/public:/var/www/html/public
      - ./services/notification/docker/nginx/certs:/etc/nginx/certs
    depends_on:
      notification-back:
        condition: service_healthy
      notification-front:
        condition: service_started
    networks: [notification]

networks:
  auth:
  notification:
  events:

volumes:
  postgres_data:
  mongo_data:
