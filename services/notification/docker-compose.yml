services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8026:8025"

  back:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: https://localhost:8443
      DB_CONNECTION: mongodb
      MONGODB_DSN: mongodb://mongo:27017
      MONGODB_HOST: mongo
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: notification
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: mail
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: notifications@example.com
      MAIL_FROM_NAME: Notification
    volumes:
      - .:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\""]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
      mail:
        condition: service_started

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/certs:/etc/nginx/certs
    depends_on:
      back:
        condition: service_healthy
      front:
        condition: service_started

volumes:
  mongo_data:
