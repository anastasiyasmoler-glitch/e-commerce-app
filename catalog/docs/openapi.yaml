openapi: 3.0.3
info:
  title: Catalog Service API
  version: 1.0.0
  description: |
    Product catalog read API: stores, categories, products (list & show).
    All routes are public GET endpoints with no `/api` prefix.
    Product images are served from the MinIO-backed `/product-images/` path via nginx.
servers:
  - url: https://localhost/api/catalog
    description: Auth gateway (storefront)
  - url: https://localhost:8444
    description: Catalog nginx (direct dev)
tags:
  - name: Stores
  - name: Categories
  - name: Products
  - name: Health

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe (nginx)
      operationId: catalogHealthz
      security: []
      responses:
        '200':
          description: Process is up
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /up:
    get:
      tags: [Health]
      summary: Laravel application health check
      operationId: catalogUp
      security: []
      responses:
        '200':
          description: Application is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Application up }

  /stores:
    get:
      tags: [Stores]
      summary: List stores
      operationId: listStores
      security: []
      responses:
        '200':
          description: All stores (cached 300s), ordered by name
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Store'

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      operationId: listCategories
      security: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: parent_id
          in: query
          required: false
          schema: { type: integer }
          description: Filter by parent category
      responses:
        '200':
          description: Categories for the store (optionally under a parent)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '422':
          $ref: '#/components/responses/ValidationError'

  /products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      security: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: category_id
          in: query
          required: false
          schema: { type: integer }
          description: Filter by category
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Products for the store (flat page, not paginator-wrapped)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '422':
          $ref: '#/components/responses/ValidationError'

  /products/{product}:
    get:
      tags: [Products]
      summary: Show a product
      operationId: showProduct
      security: []
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: integer }
          description: Product ID (route model binding)
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Product detail (404 when not found or not in this store)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/MessageError'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    StoreId:
      name: store_id
      in: query
      required: true
      schema: { type: integer }
      description: Store the entity belongs to
  schemas:
    Store:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
    Category:
      type: object
      required: [id, store_id, name, slug]
      properties:
        id: { type: integer }
        store_id: { type: integer }
        parent_id: { type: integer, nullable: true }
        name: { type: string }
        slug: { type: string }
    Stock:
      type: object
      required: [quantity, reserved]
      properties:
        quantity: { type: integer, example: 42 }
        reserved: { type: integer, example: 0 }
    Product:
      type: object
      required: [id, store_id, category_id, name, slug, price, attributes, stock]
      properties:
        id: { type: integer }
        store_id: { type: integer }
        category_id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        sku: { type: string, nullable: true }
        price: { type: integer, description: Price in minor units }
        attributes:
          type: object
          additionalProperties: { type: string }
          description: Map of attribute code to value
        image: { type: string, nullable: true, description: Storage path }
        image_url: { type: string, nullable: true, description: Public URL of the image }
        stock:
          $ref: '#/components/schemas/Stock'
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
  responses:
    MessageError:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
