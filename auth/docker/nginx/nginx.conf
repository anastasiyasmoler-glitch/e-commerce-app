user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 32m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # $arg_token is empty inside the auth_request subrequest (it has no query string),
    # so the token must be captured here, in the original location, before auth_request runs.
    map $gateway_admin_token $gateway_admin_bearer {
        default "Bearer $gateway_admin_token";
        ""      $http_authorization;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /var/www/html/public;
        index index.php;

        # Internal subrequest: Auth validates Bearer JWT + staff role before routing to protected services.
        location = /_auth_check {
            internal;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param REQUEST_URI /_gateway/staff;
            fastcgi_param REQUEST_METHOD GET;
            fastcgi_param QUERY_STRING "";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_ACCEPT application/json;
            fastcgi_param HTTPS on;
            fastcgi_pass auth-back:9000;
            fastcgi_pass_request_body off;
        }

        # Internal subrequest: Auth validates customer access JWT before routing to Order API.
        location = /_auth_customer {
            internal;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param REQUEST_URI /_gateway/customer;
            fastcgi_param REQUEST_METHOD GET;
            fastcgi_param QUERY_STRING "";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_ACCEPT application/json;
            fastcgi_param HTTPS on;
            fastcgi_pass auth-back:9000;
            fastcgi_pass_request_body off;
        }

        # Internal subrequest: Auth validates access JWT (?token=... or Authorization) + admin role for Filament.
        location = /_auth_admin {
            internal;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param REQUEST_URI /_gateway/admin;
            fastcgi_param REQUEST_METHOD GET;
            fastcgi_param QUERY_STRING "";
            fastcgi_param HTTP_AUTHORIZATION $gateway_admin_bearer;
            fastcgi_param HTTP_ACCEPT application/json;
            fastcgi_param HTTPS on;
            fastcgi_pass auth-back:9000;
            fastcgi_pass_request_body off;
        }

        # Search Swagger UI (/api/search/docs -> search-nginx/docs)
        location ^~ /api/search/docs {
            set $search_upstream https://search-nginx;
            rewrite ^/api/search/docs(.*)$ /docs$1 break;
            proxy_pass $search_upstream;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Routing: Search public API (/api/search* -> search-nginx/search*) — no JWT (search.mdc)
        location /api/search {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Accept, X-Requested-With" always;
                return 204;
            }

            set $search_upstream https://search-nginx;

            rewrite ^/api/search(.*)$ /search$1 break;

            proxy_pass $search_upstream;
            proxy_ssl_verify off;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Routing: Catalog public REST API (/api/catalog/* -> catalog-nginx/*)
        location /api/catalog/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
                return 204;
            }

            set $catalog_upstream https://catalog-nginx;
            rewrite ^/api/catalog/(.*)$ /$1 break;
            proxy_pass $catalog_upstream;
            proxy_ssl_verify off;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Access-Control-Max-Age;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Catalog MinIO (S3) — browser uploads via HTTPS; signature expects Host minio:9000
        location ^~ /product-images/ {
            client_max_body_size 32m;
            proxy_pass http://catalog-minio:9000/product-images/;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
                                                                                                                                                                                                                                         proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }

        # Routing: Catalog Filament Admin Panel (/catalog-admin* -> catalog-nginx/catalog-admin*)
        location ^~ /catalog-admin {
            set $gateway_admin_token $arg_token;

            auth_request /_auth_admin;
            auth_request_set $auth_user_email $upstream_http_x_auth_user_email;
            auth_request_set $auth_user_name $upstream_http_x_auth_user_name;

            set $catalog_upstream https://catalog-nginx;
            proxy_pass $catalog_upstream;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Auth-User-Email $auth_user_email;
            proxy_set_header X-Auth-User-Name $auth_user_name;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Catalog Filament + Livewire (hash routes and published vendor/livewire after livewire:publish)
        location ~ ^/(js/filament|css/filament|fonts/filament|vendor/livewire|livewire(?:-[a-z0-9]+)?)/ {
            set $catalog_upstream https://catalog-nginx;
            proxy_pass $catalog_upstream;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Stripe webhooks: no JWT (signature verified in Order). Public entry on gateway :443 for dev (stripe listen).
        location = /webhooks/stripe {
            client_max_body_size 1m;

            set $order_upstream https://order-nginx;
            proxy_pass $order_upstream/webhooks/stripe;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header Stripe-Signature $http_stripe_signature;
            proxy_set_header Content-Type $content_type;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Routing: Order REST API (/api/orders* -> order-nginx/orders*)
        location /api/orders {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With, Idempotency-Key" always;
                return 204;
            }

            auth_request /_auth_customer;
            auth_request_set $auth_user_id $upstream_http_x_auth_user_id;
            auth_request_set $auth_user_email $upstream_http_x_auth_user_email;
            auth_request_set $auth_user_name $upstream_http_x_auth_user_name;
            auth_request_set $auth_user_roles $upstream_http_x_auth_user_roles;

            set $order_upstream https://order-nginx;

            rewrite ^/api/orders(.*)$ /orders$1 break;

            proxy_pass $order_upstream;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Auth-User-Id $auth_user_id;
            proxy_set_header X-Auth-User-Email $auth_user_email;
            proxy_set_header X-Auth-User-Name $auth_user_name;
            proxy_set_header X-Auth-User-Roles $auth_user_roles;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Routing: Notification REST API (/api/notifications* -> notification-nginx/api/notifications*)
        location /api/notifications {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
                return 204;
            }

            auth_request /_auth_check;

            set $notification_upstream https://notification-nginx;
            proxy_pass $notification_upstream;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Routing: Auth Admin REST API (/api/admin/* -> auth /admin/*, staff JWT required)
        location ^~ /api/admin/ {
            auth_request /_auth_check;

            rewrite ^/api/admin/(.*)$ /admin/$1 break;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param REQUEST_URI $uri$is_args$args;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTPS on;
            fastcgi_pass auth-back:9000;
            fastcgi_read_timeout 120;
        }

        # API docs: serve the static Swagger UI page; /docs/openapi.yaml is not
        # in public/, so fall back to Laravel which streams base_path(docs/).
        location /docs/ {
            index index.html;
            try_files $uri $uri/ /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_pass auth-back:9000;
            fastcgi_read_timeout 120;
        }
    }
}
